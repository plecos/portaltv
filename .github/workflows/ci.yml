name: CI

on:
  pull_request:   # pushes to main are tested by the release workflow
  workflow_dispatch:   # the Run workflow button

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the version number is the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25   # gradle/gradle-daemon-jvm.properties pins this

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
