name: CI

on:
  pull_request:   # the release workflow tests main again when you run it
  workflow_dispatch:   # the Run workflow button

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reading the code is all CI needs, so the token gets nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a normal run takes about 4; a stuck one should fail by itself
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the version number is the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25   # gradle/gradle-daemon-jvm.properties pins this

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug :sample-extension:lintDebug :conformance-extension:lintDebug

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Starts an emulator and runs scripts/conformance.sh: a misbehaving extension tries what it shouldn't be able to do to
  # Portal's extension host API, through Android's real IPC, and every attempt must be refused.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the apps
        run: ./gradlew assembleDebug :sample-extension:assembleDebug :conformance-extension:assembleDebug

      # An emulator needs hardware acceleration, which the runner has but only lets in through this permission.
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Conformance tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/conformance.sh

      - name: Keep the log of a failed run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: conformance-logcat.txt
          if-no-files-found: ignore
